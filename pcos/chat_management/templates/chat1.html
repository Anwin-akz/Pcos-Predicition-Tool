{% block content %}
<!DOCTYPE html>
<html>
<head>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <style>
        .container {
            display: flex;
            justify-content: space-between;
        }
        #chat-container {
            width: 60%;
            overflow-y: auto;
            height: 400px;
            border: 5px solid #0b0b28;
            padding: 10px;
        }
        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            max-width: 80%;
        }
        .user-message {
            background-color: #d1e7dd;
            align-self: flex-end;
        }
        .chatbot-message {
            background-color: #f8d7da;
            align-self: flex-start;
            text-align:right;
        }
        .box {
            display: flex;
            justify-content: space-between;
        }
        .send-button {
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <br><br><br><br>
    <div class="container" style="width:50%">
        <div id="chat-container">
            {% if initial_message %}
            <div class="message chatbot-message">
                <div class="message-content">
                    <div class="message-text">{{ initial_message }}</div>
                </div>
            </div>
            {% endif %}
        </div>
        <form id="user-input-form" style="width: 35%;" method="post">
            {% csrf_token %}
            <div class="box">
                <input type="text" id="user-input" name="user_input" placeholder="Type your message..." autofocus autocomplete="off" style="flex: 1;">
                <button type="submit" class="send-button btn btn-primary">Send</button>
            </div>
        </form>
    </div>
    <br><br><br><br>
    <script type="text/javascript">
        $(document).ready(function() {
            $('#user-input-form').on('submit', function(event) {
                event.preventDefault();
                var user_input = $('#user-input').val();
                var csrftoken = $('[name=csrfmiddlewaretoken]').val();
        
                if (user_input.trim() !== '') {
                    $('#user-input').val('');
                    appendUserMessage(user_input);
        
                    $.ajax({
                        type: 'POST',
                        url: '{% url 'chats' %}',
                        data: {
                            user_input: user_input,
                            csrfmiddlewaretoken: csrftoken
                        },
                        success: function(response) {
                            appendChatbotMessage(response.response_text);
                        },
                        error: function(xhr, status, error) {
                            console.error('AJAX Error:', error);
                        }
                    });
                }
            });
        
            function appendUserMessage(message) {
                var messageElement = $('<div class="message user-message"><div class="message-content"><div class="message-text"></div></div></div>').text(message);
                $('#chat-container').append(messageElement);
                scrollChatToBottom();
            }
        
            function appendChatbotMessage(message) {
                var messageElement = $('<div class="message chatbot-message"><div class="message-content"><div class="message-text"></div></div></div>').text(message);
                $('#chat-container').append(messageElement);
                scrollChatToBottom();
            }
        
            function scrollChatToBottom() {
                $('#chat-container').scrollTop($('#chat-container')[0].scrollHeight);
            }
        });
    </script>
</body>
</html>
{% endblock %}
